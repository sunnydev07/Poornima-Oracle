# Render Blueprint for the Poornima Oracle backend.
# One-click deploy: https://render.com/deploy?repo=https://github.com/sunnydev07/Poornima-Oracle
#
# GEMINI_API_KEY and PINECONE_API_KEY are prompted for during Blueprint creation
# and are never committed. ADMIN_API_KEY is generated by Render.
services:
  - type: web
    name: poornima-oracle-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: https://sunnydev07.github.io
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PINECONE_INDEX_NAME
        value: poornima-oracle
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: NOTICE_SYNC_ENABLED
        value: "true"
      - key: NOTICE_SYNC_CRON
        value: "30 0 * * *"
      - key: ENABLE_PDF_EXTRACTION
        value: "true"
      - key: FALLBACK_ENABLED
        value: "true"
