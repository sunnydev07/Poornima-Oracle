# Cloud Build: build container image and deploy to Cloud Run
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/poornima-oracle', '.']
  # Deploy to Cloud Run (managed, unauthenticated so the browser can call it)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'poornima-oracle'
      - '--image'
      - 'gcr.io/$PROJECT_ID/poornima-oracle'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production,CORS_ORIGIN=https://sunnydev07.github.io,TRUST_PROXY_HOPS=1,PINECONE_INDEX_NAME=poornima-oracle,NOTICE_SYNC_ENABLED=true,NOTICE_SYNC_CRON=30 0 * * *,ENABLE_PDF_EXTRACTION=true,FALLBACK_ENABLED=true'
      - '--set-secrets'
      - 'GEMINI_API_KEY=gemini-api-key:latest,PINECONE_API_KEY=pinecone-api-key:latest,ADMIN_API_KEY=admin-api-key:latest'
      - '--timeout'
      - '900s'
