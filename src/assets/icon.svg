<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" result="blur" />
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#orbGrad)" stroke-width="4" opacity="0.4" filter="url(#outerGlow)" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.3" />

  <!-- Oracle Gradient Core Sphere -->
  <circle cx="256" cy="256" r="132" fill="url(#orbGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Highlights -->
  <ellipse cx="220" cy="190" rx="60" ry="35" fill="#ffffff" opacity="0.25" transform="rotate(-25 220 190)" />

  <!-- Central Oracle Sparkle (4-point Star) -->
  <path d="M 256 160 Q 256 256 160 256 Q 256 256 256 352 Q 256 256 352 256 Q 256 256 256 160 Z" 
        fill="url(#starGrad)" 
        filter="url(#glow)" />

  <!-- Secondary Mini Sparkles -->
  <path d="M 330 180 Q 330 205 305 205 Q 330 205 330 230 Q 330 205 355 205 Q 330 205 330 180 Z" 
        fill="#ffffff" 
        opacity="0.9" />
  <path d="M 180 300 Q 180 318 162 318 Q 180 318 180 336 Q 180 318 198 318 Q 180 318 180 300 Z" 
        fill="#cffafe" 
        opacity="0.8" />
</svg>
